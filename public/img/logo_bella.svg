<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 10 150 220">
    <defs>
        <g id="flower">
            <ellipse cx="0" cy="0" rx="7" ry="24" fill="currentColor" transform="rotate(0)" />
            <ellipse cx="0" cy="0" rx="7" ry="24" fill="currentColor" transform="rotate(60)" />
            <ellipse cx="0" cy="0" rx="7" ry="24" fill="currentColor" transform="rotate(120)" />
            <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
        </g>
    </defs>

    <!-- Base/Pata -->
    <path d="M 100,165 L 100,210" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 65,215 Q 100,195 135,215" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Pomo superior -->
    <circle cx="100" cy="18" r="4" fill="#FFFFFF" />
    <path d="M 97,25 L 103,25" stroke="#FFFFFF" stroke-width="3" />

    <!-- Torso Maniquí -->
    <path d="M 90,30 
             C 70,50 65,80 75,100 
             C 85,120 90,130 75,160 
             Q 100,170 125,160 
             C 110,130 115,120 125,100 
             C 135,80 130,50 110,30 
             Z" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- Flores -->
    <g transform="translate(55, 115)" color="#F4C430">
        <use href="#flower" />
    </g>
    
    <g transform="translate(145, 85) scale(0.9)" color="#3DA9E0">
        <use href="#flower" />
    </g>
    
    <g transform="translate(130, 155) scale(0.9)" color="#E85D5D">
        <use href="#flower" />
    </g>
</svg>
